name: iOS simulator

on:
  push:
  pull_request:

jobs:
  simulator:
    name: Build App and widget without signing
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and copy the web app into the iOS project
        run: |
          npm ci
          npm run cap:sync
      - name: Choose an iPhone Pro simulator
        id: sim
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          chosen = None
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  name = device.get("name", "")
                  if device.get("isAvailable") and name.startswith("iPhone") and "Pro" in name and "Max" not in name:
                      chosen = device
                      break
              if chosen:
                  break
          if not chosen:
              raise SystemExit("No iPhone Pro simulator is available")
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"udid={chosen['udid']}\n")
          print(chosen["name"], chosen["udid"])
          PY
      - name: Build for the iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Boot the simulator and capture home, a folder, and a goal
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP="$(find ios/DerivedData -path '*Debug-iphonesimulator*' -name 'App.app' -type d | head -1)"
          test -n "$APP"
          ORIG="$APP/public/src/app.js"
          cp "$ORIG" /tmp/itworks-app.orig.js
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          mkdir -p screenshots
          python3 - <<'PY'
          from pathlib import Path
          source = Path("/tmp/itworks-app.orig.js").read_text()
          needle = "render();\nrequestPersistentStorage();"
          if needle not in source:
              raise SystemExit("Could not find the launch render in the built app")
          shots = {
              "home": "view = 'all';\nrender();\nrequestPersistentStorage();",
              "folder": "view = orderedAreas(workspace)[0].id;\nrender();\nrequestPersistentStorage();",
              "goal": "view = orderedAreas(workspace)[0].id;\nrender();\nshowMetricForm(view, metricsInArea(workspace, view)[0]);\nrequestPersistentStorage();",
          }
          prelude = "workspace = demoWorkspace();\nnormalizeMetricOrders(workspace);\nlastSaved = structuredClone(workspace);\n"
          out = Path("/tmp/itworks-shots")
          out.mkdir(exist_ok=True)
          for name, body in shots.items():
              (out / f"{name}.js").write_text(source.replace(needle, prelude + body, 1))
          PY
          for screen in home folder goal; do
            cp "/tmp/itworks-shots/${screen}.js" "$ORIG"
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl terminate "$UDID" com.statego2.itworks || true
            xcrun simctl launch "$UDID" com.statego2.itworks
            sleep 6
            xcrun simctl io "$UDID" screenshot "screenshots/${screen}.png"
          done
      - name: Upload simulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: screenshots/*.png
